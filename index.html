<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legacy Roofing TV</title>
<style>
  /* ========================================================================
     LEGACY ROOFING — OFFICE TV (video mode)
     Plays the career ladder video full screen on a loop.
     The sales stat board is parked in dashboard.html, untouched.
     ======================================================================== */
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #hint{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);display:none;
        padding:14px 26px;border:3px solid #abe1fa;background:rgba(25,17,69,.85);color:#fff;
        font:700 24px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.06em}
</style>
</head>
<body>
<video id="v" poster="career-ladder-poster.jpg" autoplay muted loop playsinline preload="auto"></video>
<div id="hint">Press OK on the remote to start the video</div>

<script>
/* ==========================================================================
   CONFIG
   - New video? Upload it under a NEW file name (e.g. career-ladder-v8.mp4),
     put that name in VIDEO, and change BUILD. Upload both in one commit.
   - TVs check for a new BUILD every CHECK_MINUTES and switch over on their
     own at the moment the video loops. No need to touch the TV.
   ========================================================================== */
const VIDEO = 'career-ladder-v8.mp4';
const BUILD = 'video-v8-2026-10-08';
const CHECK_MINUTES = 10;

const v = document.getElementById('v');
const hint = document.getElementById('hint');

// Start playback. The banner only appears if the TV browser blocks autoplay.
function start(){
  const p = v.play();
  if (p && p.catch) p.catch(e => { if (e && e.name === 'NotAllowedError') hint.style.display = 'block'; });
}
v.addEventListener('playing', () => { hint.style.display = 'none'; });
['keydown','click','touchstart'].forEach(ev => document.addEventListener(ev, () => {
  v.muted = true; start();
  if (document.documentElement.requestFullscreen && !document.fullscreenElement)
    document.documentElement.requestFullscreen().catch(() => {});
}));

// Download the video once and loop it from memory: no re-downloads every loop,
// and it keeps playing through a Wi-Fi drop. Falls back to streaming if that fails.
async function loadVideo(){
  try {
    const r = await fetch(VIDEO + '?b=' + encodeURIComponent(BUILD));
    if (!r.ok) throw 0;
    const b = await r.blob();
    if (b.size < 1e6 || !/^video\//.test(b.type)) throw 0;   // guards against an error page or a Git LFS pointer
    v.src = URL.createObjectURL(b);
  } catch (e) {
    v.src = VIDEO + '?b=' + encodeURIComponent(BUILD);
  }
  start();
}

// Safety net for TV browsers that drop the loop flag or stall.
v.addEventListener('ended', () => { v.currentTime = 0; start(); });
let lastT = -1, stuck = 0;
setInterval(() => {
  if (!v.src) return;
  if (v.paused || v.readyState < 2) { start(); }
  if (!v.paused && v.currentTime === lastT) { if (++stuck >= 3) { stuck = 0; hint.style.display = 'none'; v.load(); start(); } }
  else { stuck = 0; }
  lastT = v.currentTime;
}, 5000);
v.addEventListener('error', () => setTimeout(() => { hint.style.display = 'none'; v.load(); start(); }, 10000));

// Update check: reload only when a NEW page has been uploaded, the server
// answers OK (checked again right before leaving), and the video has just
// looped, so the TV never lands on an error page or cuts the video off.
let pendingReload = false, prevT = 0, leaving = false;
async function newerPageIsLive(){
  try {
    const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return false;
    const html = await r.text();
    const m = html.match(/const BUILD = '([^']+)'/);
    if (m) {                                                   // a new version of this video page:
      if (m[1] === BUILD) return false;                        // only switch once its video file is live too
      const vid = html.match(/const VIDEO = '([^']+)'/);
      if (!vid) return false;
      const h = await fetch(vid[1] + '?probe=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      return h.ok && /^video\//.test(h.headers.get('content-type') || '');
    }
    return /<html/i.test(html) && html.length > 500;           // a different page, e.g. the stat board swapped back in
  } catch (e) { return false; }                                // offline: keep playing what we have
}
setInterval(async () => { if (await newerPageIsLive()) pendingReload = true; }, CHECK_MINUTES * 60 * 1000);
v.addEventListener('timeupdate', async () => {
  const looped = v.currentTime + 1 < prevT;
  prevT = v.currentTime;
  if (pendingReload && looped && !leaving) {
    leaving = true;
    if (await newerPageIsLive()) location.replace(location.pathname + '?r=' + Date.now());
    else { pendingReload = false; leaving = false; }
  }
});

loadVideo();
</script>
</body>
</html>
